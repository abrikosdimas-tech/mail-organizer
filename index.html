<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Почтовый Органайзер">
    <meta name="theme-color" content="#111111">
    <meta name="description" content="Органайзер почт с отметками и комментариями">
    <title>Почтовый Органайзер</title>
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header id="main-header">
            <div class="header-top">
                <h1 id="app-title">Почта</h1>
                <div class="header-actions">
                    <button id="btn-select-all" class="header-btn" title="Включить все">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 11 12 14 22 4"/>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                        </svg>
                    </button>
                    <button id="btn-add-group" class="header-btn" title="Новая группа">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                            <line x1="12" y1="11" x2="12" y2="17"/>
                            <line x1="9" y1="14" x2="15" y2="14"/>
                        </svg>
                    </button>
                    <button id="btn-add" class="header-btn" title="Добавить почту">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="search-container">
                <div class="search-bar">
                    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="search-input" placeholder="Поиск..." autocomplete="off">
                </div>
            </div>
        </header>

        <main id="mail-list">
            <div id="sections-container"></div>
            <div id="empty-state" class="empty-state hidden">
                <p class="empty-text">Нет почт</p>
                <p class="empty-sub">Нажмите + чтобы добавить</p>
            </div>
        </main>

        <div id="toast" class="toast hidden">Скопировано</div>

        <!-- Add/Edit Mail Modal -->
        <div id="modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <button id="modal-cancel" class="modal-btn cancel">Отмена</button>
                    <h2 class="modal-title" id="modal-title-text">Новая почта</h2>
                    <button id="modal-save" class="modal-btn save">Готово</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label for="input-email">Email</label>
                        <input type="email" id="input-email" placeholder="example@mail.com" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="input-name">Описание</label>
                        <input type="text" id="input-name" placeholder="Личная, рабочая..." autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="input-comment">Комментарий</label>
                        <textarea id="input-comment" placeholder="Заметка..." rows="3"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Group Management Modal -->
        <div id="group-modal-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <button id="group-modal-cancel" class="modal-btn cancel">Отмена</button>
                    <h2 class="modal-title">Группы</h2>
                    <button id="group-modal-save" class="modal-btn save">Добавить</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label for="input-group-name">Новая группа</label>
                        <input type="text" id="input-group-name" placeholder="Название..." autocomplete="off">
                    </div>
                    <div id="existing-groups"></div>
                </div>
            </div>
        </div>

        <!-- Picker Modal: add mails to group -->
        <div id="picker-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <button id="picker-cancel" class="modal-btn cancel">Отмена</button>
                    <h2 class="modal-title" id="picker-title">Добавить в группу</h2>
                    <button id="picker-save" class="modal-btn save">Готово</button>
                </div>
                <div class="modal-body">
                    <div id="picker-list"></div>
                    <div id="picker-empty" class="hidden" style="text-align:center;color:var(--text-faint);padding:20px;font-size:14px;">
                        Нет доступных почт
                    </div>
                </div>
            </div>
        </div>

        <!-- Comment Modal -->
        <div id="comment-overlay" class="modal-overlay hidden">
            <div class="modal">
                <div class="modal-header">
                    <button id="comment-cancel" class="modal-btn cancel">Закрыть</button>
                    <h2 class="modal-title">Комментарий</h2>
                    <button id="comment-save" class="modal-btn save">Готово</button>
                </div>
                <div class="modal-body">
                    <div class="comment-email-preview" id="comment-email-preview"></div>
                    <div class="input-group">
                        <textarea id="comment-textarea" placeholder="Введите комментарий..." rows="5"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete confirm -->
        <div id="delete-overlay" class="modal-overlay hidden">
            <div class="action-sheet">
                <div class="action-sheet-body">
                    <p class="action-sheet-title">Удалить?</p>
                    <p class="action-sheet-subtitle" id="delete-email-text"></p>
                    <button id="delete-confirm" class="action-btn danger">Удалить</button>
                </div>
                <button id="delete-cancel-btn" class="action-btn cancel-action">Отмена</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
